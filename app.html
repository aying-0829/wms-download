<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMS 仓储管理系统 · 在线体验</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0A1628; color: #fff; }
        .config-banner { background: rgba(59,130,246,0.1); border-bottom: 1px solid rgba(59,130,246,0.3); padding: 15px 20px; text-align: center; font-size: 14px; }
        .config-banner input { padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; width: 300px; margin: 0 10px; }
        .config-banner button { padding: 8px 20px; border-radius: 6px; border: none; background: #1D4ED8; color: #fff; cursor: pointer; font-weight: 600; }
        .config-banner button:hover { background: #3B82F6; }
        .back-link { display: inline-block; margin-left: 15px; color: #94a3b8; text-decoration: none; }
        .back-link:hover { color: #fff; }
        #app { min-height: 100vh; }
    </style>
</head>
<body>
    <div class="config-banner">
        <span>🔧 后端服务器地址：</span>
        <input id="apiBase" placeholder="http://localhost:8000/api/v1" value="http://localhost:8000/api/v1" />
        <button onclick="window.saveApiBase()">连接</button>
        <a href="/" class="back-link">← 返回首页</a>
    </div>
    <div id="app"></div>

    <script>
        // 保存后端地址到 localStorage，供 Vue 应用读取
        window.saveApiBase = function() {
            const val = document.getElementById('apiBase').value.trim();
            if (!val) { alert('请输入后端服务器地址'); return; }
            localStorage.setItem('wms_api_base', val);
            window.location.reload();
        };
        // 从 localStorage 读取后端地址；默认连本机
        const saved = localStorage.getItem('wms_api_base') || 'http://localhost:8000/api/v1';
        window.__WMS_CONFIG__ = { apiBase: saved };
    </script>
    <script type="module" crossorigin src="/assets/index-ClEN3rqV.js"></script>
</body>
</html>
