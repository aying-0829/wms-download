<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMS 仓储管理系统 · 在线体验</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0A1628; color: #fff; }
        .config-banner { background: rgba(59,130,246,0.1); border-bottom: 1px solid rgba(59,130,246,0.3); padding: 15px 20px; text-align: center; font-size: 14px; position: sticky; top: 0; z-index: 100; }
        .config-banner input { padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; width: 300px; margin: 0 10px; }
        .config-banner button { padding: 8px 20px; border-radius: 6px; border: none; background: #1D4ED8; color: #fff; cursor: pointer; font-weight: 600; }
        .config-banner button:hover { background: #3B82F6; }
        .back-link { display: inline-block; margin-left: 15px; color: #94a3b8; text-decoration: none; }
        .back-link:hover { color: #fff; }
        .status-bar { text-align: center; padding: 6px; font-size: 13px; }
        .status-bar.ok { background: rgba(16,185,129,0.15); color: #10B981; }
        .status-bar.err { background: rgba(239,68,68,0.15); color: #F87171; }
        #app { min-height: calc(100vh - 60px); }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 60px); padding: 40px 20px; text-align: center; }
        .empty-state .icon { font-size: 80px; margin-bottom: 24px; opacity: 0.6; }
        .empty-state h2 { font-size: 28px; margin-bottom: 12px; color: #fff; }
        .empty-state p { font-size: 16px; color: #94a3b8; margin: 6px 0; max-width: 600px; }
        .empty-state .steps { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 30px; margin-top: 30px; max-width: 600px; text-align: left; }
        .empty-state .steps h3 { color: #3B82F6; margin-bottom: 16px; }
        .empty-state .steps ol { padding-left: 24px; color: #cbd5e1; line-height: 2; }
        .empty-state .steps code { background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; color: #fbbf24; font-family: monospace; }
        .empty-state .btn-group { margin-top: 30px; }
        .empty-state .btn { display: inline-block; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; margin: 8px; cursor: pointer; border: none; }
        .empty-state .btn-primary { background: linear-gradient(135deg, #1D4ED8, #3B82F6); color: #fff; }
        .empty-state .btn-primary:hover { box-shadow: 0 10px 30px rgba(29,78,216,0.4); }
        .empty-state .btn-secondary { background: transparent; border: 2px solid #1D4ED8; color: #fff; }
    </style>
</head>
<body>
    <div class="config-banner">
        <span>🔧 后端服务器地址：</span>
        <input id="apiBase" placeholder="http://localhost:8000/api/v1" />
        <button onclick="window.saveApiBase()">连接</button>
        <a href="/" class="back-link">← 返回首页</a>
    </div>
    <div id="status" class="status-bar"></div>
    <div id="app"></div>

    <script>
        window.saveApiBase = function() {
            const val = document.getElementById('apiBase').value.trim();
            if (!val) { alert('请输入后端服务器地址'); return; }
            localStorage.setItem('wms_api_base', val);
            window.location.reload();
        };

        // 读取已保存的后端地址
        const saved = localStorage.getItem('wms_api_base') || 'http://localhost:8000/api/v1';
        document.getElementById('apiBase').value = saved;
        window.__WMS_CONFIG__ = { apiBase: saved };

        // 测试后端连接状态
        async function checkBackend() {
            const status = document.getElementById('status');
            try {
                // 把 /api/v1 截掉，测根路径
                const base = saved.replace(/\/api\/v1\/?$/, '');
                const r = await fetch(base + '/docs', { method: 'GET', mode: 'cors' });
                if (r.ok) {
                    status.className = 'status-bar ok';
                    status.innerHTML = '✅ 后端已连接 · ' + saved;
                    return true;
                }
                throw new Error('HTTP ' + r.status);
            } catch (e) {
                status.className = 'status-bar err';
                status.innerHTML = '❌ 后端未连接 · 当前地址：' + saved + ' · 请先在本地启动后端服务';
                return false;
            }
        }

        // 如果连不上后端，显示引导页（不加载 Vue）
        checkBackend().then(connected => {
            if (!connected) {
                document.getElementById('app').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🚀</div>
                        <h2>系统尚未启动</h2>
                        <p>WMS 仓储管理系统需要先在本地启动后端服务，才能进入登录页。</p>
                        <p>你的电脑还没有运行后端，所以看不到登录界面。</p>
                        <div class="steps">
                            <h3>📋 三种启动方式（任选其一）</h3>
                            <ol>
                                <li><b>下载桌面客户端（最简单）</b>：首页点「下载桌面客户端」→ 双击安装 → 自动启动</li>
                                <li><b>下载一键启动包</b>：首页点「下载服务端版」→ 解压 → 双击 <code>启动后端.bat</code></li>
                                <li><b>已经有后端在跑</b>：在上方填写正确的后端地址（如 <code>http://192.168.1.10:8000/api/v1</code>）→ 点「连接」</li>
                            </ol>
                        </div>
                        <div class="btn-group">
                            <a href="/WMS-Client-Setup.exe" class="btn btn-primary">📥 下载桌面客户端</a>
                            <a href="/WMS-Setup.exe" class="btn btn-secondary">📦 下载服务端版</a>
                            <a href="/" class="btn btn-secondary">← 返回首页</a>
                        </div>
                    </div>
                `;
                return; // 不加载 Vue JS
            }
            // 连得上，加载 Vue 应用
            const s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = '/assets/index-ClEN3rqV.js';
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
