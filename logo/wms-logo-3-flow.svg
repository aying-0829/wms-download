<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arrow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="arrow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="#0A1628"/>
  <!-- Three flowing arrows in circular pattern -->
  <!-- Arrow 1 - top -->
  <path d="M256 100 L290 180 L256 160 L222 180 Z"
        fill="url(#arrow1)" opacity="0.95"/>
  <!-- Arrow 2 - bottom right -->
  <path d="M380 310 L350 250 L330 270 L290 240 L310 280 L330 260 Z"
        fill="url(#arrow2)" opacity="0.9"/>
  <!-- Arrow 3 - bottom left -->
  <path d="M132 310 L162 250 L182 270 L222 240 L202 280 L182 260 Z"
        fill="url(#arrow3)" opacity="0.85"/>
  <!-- Connecting circular flow -->
  <circle cx="256" cy="256" r="140" fill="none"
          stroke="url(#arrow1)" stroke-width="4" stroke-dasharray="8 12" opacity="0.4"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="20" fill="#1D4ED8" opacity="0.8"/>
  <!-- Subtle pulse rings -->
  <circle cx="256" cy="256" r="60" fill="none" stroke="#0D9488" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#1D4ED8" stroke-width="1" opacity="0.2"/>
</svg>
